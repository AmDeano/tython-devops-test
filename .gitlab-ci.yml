# Pipeline GitLab (bonus) : exécuté sur le miroir GitLab, en complément de GitHub Actions.
# Même logique que la CI GitHub : lint -> test -> build -> image Docker (registry GitLab).

stages: [lint, test, build, package]

default:
  image: node:22-alpine
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH == 'dev'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.node-app:
  before_script:
    - cd "$APP"
    - npm ci --cache .npm --prefer-offline
  cache:
    key: npm-$APP
    paths: ['$APP/.npm/']
  parallel:
    matrix:
      - APP: [backend, frontend]

lint:
  stage: lint
  extends: .node-app
  script:
    - npm run lint
    - npm run format:check

test:backend:
  stage: test
  extends: .node-app
  parallel:
    matrix:
      - APP: [backend]
  script:
    - npm test

build:
  stage: build
  extends: .node-app
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths: ['frontend/dist/']

docker:
  stage: package
  image: docker:27
  services: ['docker:27-dind']
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  parallel:
    matrix:
      - IMAGE: [backend, frontend, db]
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - TAG="${CI_COMMIT_TAG:-sha-$CI_COMMIT_SHA}"
    - docker build --build-arg APP_VERSION="$TAG" -t "$CI_REGISTRY_IMAGE/$IMAGE:$TAG" "./$IMAGE"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE:$TAG"
