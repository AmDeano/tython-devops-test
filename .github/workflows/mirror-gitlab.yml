name: Mirror vers GitLab

# GitHub howa la source. kol push (branches + tags) kaytnsakh f GitLab
# secrets li khassin : GITLAB_MIRROR_URL (ex: https://gitlab.com/<user>/<repo>.git)
#                      GITLAB_TOKEN      (Project Access Token, role Maintainer, scope write_repository)
on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: wach secrets kaynin
        id: check
        env:
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
        run: |
          if [ -z "$GITLAB_MIRROR_URL" ]; then
            echo "::notice::GITLAB_MIRROR_URL makaynch, skip dyal mirroring"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: push l GitLab
        if: steps.check.outputs.enabled == 'true'
        env:
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          REMOTE="https://oauth2:${GITLAB_TOKEN}@${GITLAB_MIRROR_URL#https://}"
          git remote add gitlab "$REMOTE"
          # ga3 les branches + tags, w --prune kay7ayd f GitLab dakchi li t7ayd f GitHub
          git push gitlab --force --prune 'refs/remotes/origin/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
