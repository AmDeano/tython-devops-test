# monitoring, kanzidoh fo9 compose dyal local wla prod :
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
# grafana w prometheus ghir 3la 127.0.0.1 (f prod kandkhlo b tunnel ssh)

x-logging: &default-logging # rotation dyal logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    # reseau backend bach yscrapi l backend, w monitoring dyal les exporters
    networks: [backend, monitoring]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD makaynch}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
    networks: [monitoring]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro # bla rslave 7it docker desktop ma kaysupportihach
    networks: [monitoring]
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true # cadvisor khaso ychof cgroups dyal la machine
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    logging: *default-logging

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
