# Serveur du conteneur frontend : sert le build Vite et relaie l'API vers le backend.
# Tourne en non-root (nginx-unprivileged) sur le port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Assets fingerprintés par Vite : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:3000/health;
    }

    # /metrics du backend n'est volontairement pas exposé publiquement.
    location = /metrics {
        return 404;
    }

    # Fallback SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
