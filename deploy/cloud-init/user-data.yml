#cloud-config
# bootstrap dyal la VM f Proxmox (Debian 12 / Ubuntu 24.04 cloud image)
# create-vm.sh kay7tou f snippets w kaydirou cicustom
# !! bdel l cle ssh lta7t b cle publique dyalk

hostname: tython-app
timezone: Africa/Casablanca
package_update: true
package_upgrade: true

# groupe docker mazal ma kaynch hna, kanzidouh f runcmd mn b3d ma ytsala docker
users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...REMPLACER... deploy@tython

packages:
  - ca-certificates
  - curl
  - ufw
  - fail2ban
  - unattended-upgrades
  - qemu-guest-agent

write_files:
  # ssh : ghir b cle, root mamnou3
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxAuthTries 3
  # rotation dyal logs docker par defaut l ga3 les conteneurs
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }

runcmd:
  # docker + compose mn repo officiel
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - systemctl enable --now docker qemu-guest-agent
  # firewall : ssh + http/https w safi
  # rd lbal : docker kaydouz 3la ufw f les ports publiés, 3lach db/backend ma publiyinch
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - mkdir -p /opt/tython && chown deploy:deploy /opt/tython
  - systemctl restart ssh

final_message: 'VM dyal tython wajda mn b3d $UPTIME secondes'
